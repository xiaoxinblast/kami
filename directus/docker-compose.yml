name: kami-localization

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    # TM 单表 108MB、reference_chunks 42MB；默认 shared_buffers=128MB 装不下，
    # 容器重启后的冷查询会反复读盘。这里按 Docker VM 的 15GB 上限给到 1GB。
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
    # Postgres 的并行查询用 /dev/shm 做动态共享内存；Docker 默认只有 64MB，
    # shared_buffers/work_mem 调大后会报 "could not resize shared memory segment"。
    shm_size: "1gb"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kami_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  directus:
    # Pin the no-license version verified against Kami's full schema and API suite.
    image: directus/directus:11.17.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:18055:8055"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - kami_directus_uploads:/directus/uploads
      - ./schema:/directus/schema
    environment:
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      ADMIN_TOKEN: ${DIRECTUS_ADMIN_TOKEN}
      PUBLIC_URL: http://127.0.0.1:18055
      # The workbench is localhost-only and can expand one spreadsheet row into
      # four language candidates. Keep the API comfortably above the 10 MB
      # upload ceiling so candidate previews are not rejected at 1 MB.
      MAX_PAYLOAD_SIZE: "128mb"
      CORS_ENABLED: "true"
      CORS_ORIGIN: http://127.0.0.1:4173
      TELEMETRY: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8055/server/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  kami_postgres_data:
  kami_directus_uploads:
